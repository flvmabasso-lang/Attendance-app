<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de RH · Acme</title>
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F7F8;
    --text:#1D1D1F;
    --muted:#8A8A8E;
    --muted-2:#C6C6C8;
    --border:#E6E6E9;
    --success:#248A3D;
    --success-bg:#EAF7EE;
    --warn:#B4690E;
    --warn-bg:#FBF0E2;
    --error:#D93025;
    --error-bg:#FCECEB;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Login ---------- */
  #loginScreen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .login-card{
    width:100%;
    max-width:320px;
    text-align:center;
    padding:0 24px;
  }
  .login-card h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 6px;
  }
  .login-card p{
    font-size:14px;
    color:var(--muted);
    margin:0 0 28px;
  }
  .login-card input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--border);
    padding:10px 2px;
    font-size:16px;
    text-align:center;
    outline:none;
    margin-bottom:18px;
    font-family:inherit;
    background:transparent;
    color:var(--text);
  }
  .login-card input:focus{ border-bottom-color:var(--text); }
  .login-error{
    font-size:13px;
    color:var(--error);
    min-height:18px;
    margin-bottom:10px;
  }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-size:14px; font-weight:500;
    padding:11px 24px; border-radius:100px;
    transition: opacity .2s ease, transform .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-dark{ background:var(--text); color:#fff; width:100%; }
  .btn-dark:hover{ opacity:0.85; }
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-outline:hover{ background:var(--surface); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  /* ---------- App shell ---------- */
  #appScreen{ display:none; min-height:100vh; }
  #appScreen.active{ display:block; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 6vw 0;
    max-width:1100px;
    margin:0 auto;
  }
  .topbar h1{ font-size:20px; font-weight:600; margin:0; }
  .logout-btn{
    background:none; border:none; color:var(--muted);
    font-size:13px; cursor:pointer;
  }
  .logout-btn:hover{ color:var(--text); }

  .switcher{
    display:inline-flex;
    background:var(--surface);
    border-radius:100px;
    padding:4px;
    gap:2px;
    margin:20px 6vw 0;
  }
  .switcher-wrap{ max-width:1100px; margin:0 auto; padding:0 6vw; }
  .switcher button{
    appearance:none; border:none; background:transparent;
    color:var(--muted); font-size:14px; font-weight:500;
    padding:8px 18px; border-radius:100px; cursor:pointer;
    transition: background .25s ease, color .25s ease;
  }
  .switcher button.active{ background:#fff; color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.08); }

  .tab{ display:none; max-width:1100px; margin:0 auto; padding:28px 6vw 8vh; }
  .tab.active{ display:block; }

  /* ---------- Controls row ---------- */
  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:end;
    gap:20px;
    margin-bottom:28px;
  }
  .field-inline label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .field-inline input, .field-inline select{
    border:none; border-bottom:1px solid var(--border);
    padding:7px 2px; font-size:14px; color:var(--text);
    background:transparent; outline:none; font-family:inherit;
    min-width:150px;
  }
  .field-inline input:focus, .field-inline select:focus{ border-bottom-color:var(--text); }

  /* ---------- Stat tiles ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
    margin-bottom:36px;
  }
  .stat{
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
  }
  .stat-value{ font-size:28px; font-weight:600; letter-spacing:-0.02em; }
  .stat-label{ font-size:13px; color:var(--muted); margin-top:4px; }
  .stat.success .stat-value{ color:var(--success); }
  .stat.warn .stat-value{ color:var(--warn); }
  .stat.error .stat-value{ color:var(--error); }

  /* ---------- Table ---------- */
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.03em;
    padding:0 0 10px; border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:13px 0; border-bottom:1px solid var(--border);
    font-size:14px; vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }

  .row-emp{ display:flex; align-items:center; gap:12px; }
  .avatar{
    width:32px; height:32px; border-radius:50%;
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--muted); overflow:hidden; flex-shrink:0;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:500;
    padding:4px 10px; border-radius:100px;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; }
  .badge.present{ background:var(--success-bg); color:var(--success); }
  .badge.present .dot{ background:var(--success); }
  .badge.late{ background:var(--warn-bg); color:var(--warn); }
  .badge.late .dot{ background:var(--warn); }
  .badge.absent{ background:var(--error-bg); color:var(--error); }
  .badge.absent .dot{ background:var(--error); }

  .empty-state{
    padding:40px 0; text-align:center; color:var(--muted); font-size:14px;
  }

  .toolbar-right{ margin-left:auto; }

  .toast{
    position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:#fff; padding:12px 22px; border-radius:100px;
    font-size:14px; font-weight:500; opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:720px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .row-emp span.dept-inline{ display:none; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Painel de RH</h1>
    <p>Introduza a senha de acesso</p>
    <input type="password" id="passwordInput" placeholder="Senha" autocomplete="off">
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-dark" id="loginBtn">Entrar</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appScreen">
  <div class="topbar">
    <h1>Painel de RH</h1>
    <button class="logout-btn" id="logoutBtn">Terminar sessão</button>
  </div>

  <div class="switcher-wrap">
    <div class="switcher">
      <button class="active" data-target="resumo">Resumo do dia</button>
      <button data-target="historico">Histórico</button>
    </div>
  </div>

  <!-- ---- TAB: Resumo do dia ---- -->
  <div class="tab active" id="resumo">
    <div class="controls">
      <div class="field-inline">
        <label for="resumoDate">Data</label>
        <input type="date" id="resumoDate">
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="statTotal">–</div>
        <div class="stat-label">Total de funcionários</div>
      </div>
      <div class="stat success">
        <div class="stat-value" id="statPresent">–</div>
        <div class="stat-label">Presentes</div>
      </div>
      <div class="stat warn">
        <div class="stat-value" id="statLate">–</div>
        <div class="stat-label">Atrasados</div>
      </div>
      <div class="stat error">
        <div class="stat-value" id="statAbsent">–</div>
        <div class="stat-label">Ausentes</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Funcionário</th>
          <th>Estado</th>
          <th>Hora de entrada</th>
        </tr>
      </thead>
      <tbody id="resumoBody"></tbody>
    </table>
    <div class="empty-state" id="resumoEmpty" style="display:none;"></div>
  </div>

  <!-- ---- TAB: Histórico ---- -->
  <div class="tab" id="historico">
    <div class="controls">
      <div class="field-inline">
        <label for="fromDate">De</label>
        <input type="date" id="fromDate">
      </div>
      <div class="field-inline">
        <label for="toDate">Até</label>
        <input type="date" id="toDate">
      </div>
      <div class="field-inline">
        <label for="deptFilter">Departamento</label>
        <select id="deptFilter"><option value="">Todos</option></select>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-outline" id="exportBtn">Exportar CSV</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data e hora</th>
          <th>Funcionário</th>
          <th>Departamento</th>
          <th>Método</th>
          <th>Confiança</th>
        </tr>
      </thead>
      <tbody id="historicoBody"></tbody>
    </table>
    <div class="empty-state" id="historicoEmpty" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ---------- Configuração ---------- */
  const CONFIG = {
    API_BASE: 'https://attendance-api-c540.onrender.com',
  };

  // Temporário: para pré-visualizar a interface sem precisar de login.
  // Para reativar o login, basta mudar isto para false.
  const SKIP_LOGIN = true;

  let adminKey = null; // fica só em memória — nunca em localStorage/sessionStorage

  async function apiFetch(path, options = {}) {
    const res = await fetch(CONFIG.API_BASE + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(adminKey ? { 'x-admin-key': adminKey } : {}),
        ...(options.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || `Erro ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 2400);
  }

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  /* ---------- Login ---------- */
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');

  async function doLogin(){
    const password = passwordInput.value;
    if(!password){ loginError.textContent = 'Indique a senha'; return; }
    loginBtn.disabled = true;
    loginError.textContent = '';
    try{
      const res = await fetch(CONFIG.API_BASE + '/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password }),
      });
      if(!res.ok){
        const data = await res.json().catch(()=>({}));
        loginError.textContent = data.error || 'Senha incorreta';
        loginBtn.disabled = false;
        return;
      }
      adminKey = password;
      loginScreen.style.display = 'none';
      appScreen.classList.add('active');
      passwordInput.value = '';
      initApp();
    }catch(err){
      loginError.textContent = 'Não foi possível ligar à API — verifique se está a correr';
    }
    loginBtn.disabled = false;
  }

  loginBtn.addEventListener('click', doLogin);
  passwordInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });

  logoutBtn.addEventListener('click', ()=>{
    adminKey = null;
    appScreen.classList.remove('active');
    loginScreen.style.display = 'flex';
  });

  /* ---------- Tabs ---------- */
  const switcherBtns = document.querySelectorAll('.switcher button');
  const tabs = document.querySelectorAll('.tab');
  switcherBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      switcherBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      tabs.forEach(t=>t.classList.remove('active'));
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });

  /* ---------- Resumo do dia ---------- */
  const resumoDate = document.getElementById('resumoDate');
  const statTotal = document.getElementById('statTotal');
  const statPresent = document.getElementById('statPresent');
  const statLate = document.getElementById('statLate');
  const statAbsent = document.getElementById('statAbsent');
  const resumoBody = document.getElementById('resumoBody');
  const resumoEmpty = document.getElementById('resumoEmpty');

  const statusLabel = { present:'Presente', late:'Atrasado', absent:'Ausente' };

  function formatTime(datetimeStr){
    if(!datetimeStr) return '—';
    const t = (datetimeStr.split(' ')[1] || datetimeStr.split('T')[1] || '').slice(0,5);
    return t || '—';
  }

  async function loadResumo(){
    resumoBody.innerHTML = '';
    resumoEmpty.style.display = 'none';
    try{
      const data = await apiFetch(`/api/reports/summary?date=${resumoDate.value}`);
      statTotal.textContent = data.total_employees;
      statPresent.textContent = data.present_count;
      statLate.textContent = data.late_count;
      statAbsent.textContent = data.absent_count;

      if(data.employees.length === 0){
        resumoEmpty.style.display = 'block';
        resumoEmpty.textContent = 'Sem funcionários cadastrados.';
        return;
      }

      data.employees
        .sort((a,b)=> a.name.localeCompare(b.name))
        .forEach(emp=>{
          const initials = emp.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <div class="row-emp">
                <div class="avatar">${emp.photo_base64 ? `<img src="${emp.photo_base64}">` : initials}</div>
                <div>
                  <div>${emp.name}</div>
                  <span class="dept-inline" style="font-size:12px;color:var(--muted);">${emp.department || '—'}</span>
                </div>
              </div>
            </td>
            <td><span class="badge ${emp.status}"><span class="dot"></span>${statusLabel[emp.status]}</span></td>
            <td>${formatTime(emp.check_in_time)}</td>
          `;
          resumoBody.appendChild(tr);
        });
    }catch(err){
      resumoEmpty.style.display = 'block';
      resumoEmpty.textContent = 'Erro ao carregar: ' + err.message;
    }
  }
  resumoDate.addEventListener('change', loadResumo);

  /* ---------- Histórico ---------- */
  const fromDate = document.getElementById('fromDate');
  const toDate = document.getElementById('toDate');
  const deptFilter = document.getElementById('deptFilter');
  const historicoBody = document.getElementById('historicoBody');
  const historicoEmpty = document.getElementById('historicoEmpty');
  const exportBtn = document.getElementById('exportBtn');

  let historicoRows = [];

  async function loadDepartments(){
    try{
      const employees = await apiFetch('/api/employees');
      const depts = [...new Set(employees.map(e=>e.department).filter(Boolean))].sort();
      deptFilter.innerHTML = '<option value="">Todos</option>' + depts.map(d=>`<option value="${d}">${d}</option>`).join('');
    }catch(err){ /* silencioso — filtro fica só com "Todos" */ }
  }

  async function loadHistorico(){
    historicoBody.innerHTML = '';
    historicoEmpty.style.display = 'none';
    const params = new URLSearchParams();
    if(fromDate.value) params.set('from', fromDate.value);
    if(toDate.value) params.set('to', toDate.value);
    if(deptFilter.value) params.set('department', deptFilter.value);

    try{
      historicoRows = await apiFetch(`/api/reports/checkins?${params.toString()}`);
      if(historicoRows.length === 0){
        historicoEmpty.style.display = 'block';
        historicoEmpty.textContent = 'Nenhuma marcação encontrada para este filtro.';
        return;
      }
      historicoRows.forEach(row=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.created_at}</td>
          <td>${row.employee_name}</td>
          <td>${row.employee_department || '—'}</td>
          <td>${row.method}</td>
          <td>${row.confidence ? Math.round(row.confidence*100) + '%' : '—'}</td>
        `;
        historicoBody.appendChild(tr);
      });
    }catch(err){
      historicoEmpty.style.display = 'block';
      historicoEmpty.textContent = 'Erro ao carregar: ' + err.message;
    }
  }

  [fromDate, toDate, deptFilter].forEach(el => el.addEventListener('change', loadHistorico));

  exportBtn.addEventListener('click', ()=>{
    if(historicoRows.length === 0){ showToast('Nada para exportar'); return; }
    const header = ['Data e hora','Funcionário','Departamento','Método','Confiança'];
    const lines = [header.join(',')];
    historicoRows.forEach(r=>{
      lines.push([
        r.created_at,
        `"${r.employee_name}"`,
        `"${r.employee_department || ''}"`,
        r.method,
        r.confidence ?? '',
      ].join(','));
    });
    const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `presencas_${fromDate.value || 'todas'}_a_${toDate.value || 'hoje'}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  /* ---------- Init ---------- */
  function initApp(){
    resumoDate.value = todayStr();
    loadResumo();
    loadDepartments();
    loadHistorico();
  }

  if (SKIP_LOGIN) {
    adminKey = 'admin123';
    loginScreen.style.display = 'none';
    appScreen.classList.add('active');
    initApp();
  }
</script>

</body>
</html>
